id: lark_iridium_burst_energy
label: Iridium Burst Energy
category: '[LARK]'
flags: [python, cmake]

parameters:
-   id: cpi_size
    label: CPI Size
    dtype: int
    default: '131072'
-   id: fs
    label: Sample Rate (Hz)
    dtype: float
    default: '1024000.0'
-   id: n_ant
    label: Num Antennas
    dtype: int
    default: '5'
-   id: energy_window
    label: Energy Window
    dtype: int
    default: '256'
-   id: threshold_factor
    label: Threshold Factor
    dtype: float
    default: '3.0'
-   id: min_gap_s
    label: Min Gap (s)
    dtype: float
    default: '0.045'

inputs:
-   label: in
    domain: stream
    dtype: complex
    vlen: ${ cpi_size }
    multiplicity: ${ n_ant }

outputs:
-   label: burst_info
    domain: message
    optional: true

templates:
    imports: from lark import iridium_burst_energy
    make: |-
        lark.iridium_burst_energy(
            cpi_size=${cpi_size},
            fs=${fs},
            n_ant=${n_ant},
            energy_window=${energy_window},
            threshold_factor=${threshold_factor},
            min_gap_s=${min_gap_s})

file_format: 1