# =============================================================================
#  Heimdall DAQ — daq_chain_config.ini
#  Profilo: Iridium L-band (1626.270 MHz, simplex ring-alert)
#
#  Mappatura parametri → config.py KrakenSDR
#    sample_rate   ← SAMPLE_RATE_HZ (1024000 Hz, intero)
#    center_freq   ← FREQ_HZ        (per Iridium: 1626270000 Hz)
#    gain          ← GAIN_DB        (15 – 30 dB)
#    num_channels  ← N_ANTENNAS     (3 o 5)
#
#  Modifica questo file per cambiare frequenza/gain/canali;
#  poi riavvia Heimdall oppure usa heimdall_manager.py.
# =============================================================================

[hw]
# Scheda SDR: rtlsdr oppure soapy
device_type      = rtlsdr

# Numero di antenne/canali (KrakenSDR: 5; prototipo 3 canali: 3)
num_channels     = 5

# Frequenza centrale [Hz] — Iridium simplex ring-alert
center_freq      = 1626270000

# Frequenza di campionamento [Hz]
# Valori RTL-SDR validi: 240000, 1024000, 1600000, 2048000, 2560000
# NOTA: 1024000 dà CPI ≈ 128 ms a 131072 campioni → >= 1 slot Iridium (8.28 ms)
sample_rate      = 1024000

# Guadagno IF [dB×10] — Heimdall vuole il valore come intero in decimi di dB
# 15 dB → 150   |  30 dB → 300   |  40.2 dB → 402
gain             = 150

# Se > 0, abilita bias-T (alimenta LNA esterno via RF)
bias_tee         = 0

[daq_chain]
# Dimensione CPI (Coherent Processing Interval) in campioni per canale
# Suggeriti: 131072 (128 ms @ 1 MSPS) oppure 262144 (256 ms)
cpi_size         = 131072

# Numero di CPI nel buffer circolare interno
buffer_size      = 4

# Frame di pre-trigger (per la sincronizzazione iniziale)
pretrigger_size  = 0

[calibration]
# Sincronizzazione di fase Heimdall
# Invia impulso di calibrazione ogni N CPI (0 = disabilitato)
cal_period       = 0

# Frequenza sorgente di calibrazione interna [Hz]
# Deve essere nel range del SDR; usare 0 per disabilitare
cal_freq         = 0
