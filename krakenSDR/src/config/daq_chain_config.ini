# ============================================================
#  KrakenSDR — DAQ Chain Configuration (Iridium L-band, USB 2.0 optimised)
#
#  center_freq = 1626270000  Hz  (Iridium simplex downlink)
#  sample_rate = 1024000     Hz  (~10 MB/s USB traffic for 5 channels)
#
#  Key settings (proven working — derived from Docker working config):
#
#  en_iq_cal = 0
#    Only sample-delay sync at startup. Amplitude/phase IQ correction
#    is NOT needed for FFT/DoA display and was the cause of the "death
#    spiral": the 20 dB correlation threshold was exceeded during burst
#    recalibration (cal_track_mode=2), continuously resetting STATE_INIT.
#
#  cal_track_mode = 0
#    Calibration ONCE at startup only. With mode=2 (periodic burst) the
#    system entered an infinite DUMMY loop every time the correlation peak
#    dropped below 20 dB due to USB jitter.
#
#  maximum_sync_fails = 25
#    Tolerates transient USB jitter without resetting STATE_INIT.
#
#  adpis_gains_init = 402,402,402,402,402
#    Initial gain 40.2 dB (index 402 = dB×10) on all channels.
#    Essential for the correlation peak to exceed 20 dB during calibration.
#
#  iface_type → eth  (TCP server on port 5000)
# ============================================================

[meta]
ini_version = 7
config_name = lark_iridium

[hw]
name = kraken5
unit_id = 0
ioo_type = 0
num_ch = 5
en_bias_tee = 0,0,0,0,0

[daq]
# log_level: 1=DEBUG 2=INFO/WARNING 3=ERROR 4=CRITICAL 5=quiet
log_level = 2
daq_buffer_size = 131072
center_freq = 1626270000
sample_rate = 1024000
gain = 0
en_noise_source_ctr = 1
ctr_channel_serial_no = 1000

[pre_processing]
cpi_size = 131072
decimation_ratio = 1
fir_relative_bandwidth = 1.0
fir_tap_size = 1
fir_window = hann
en_filter_reset = 0

[calibration]
corr_size = 32768
std_ch_ind = 0
# en_iq_cal = 0: sample-delay sync only. IQ amplitude/phase correction
# causes a death spiral with USB jitter — keep disabled.
en_iq_cal = 0
amplitude_cal_mode = channel_power
en_gain_tune_init = 0
gain_lock_interval = 0
unified_gain_control = 0
require_track_lock_intervention = 0
# cal_track_mode = 0: calibrate ONCE at startup.
# Mode 2 (periodic burst) causes infinite DUMMY loop on USB jitter.
cal_track_mode = 0
cal_frame_interval = 86
cal_frame_burst_size = 10
amplitude_tolerance = 2
phase_tolerance = 1
# Increased from 10: tolerates transient USB jitter without STATE_INIT reset.
maximum_sync_fails = 25
iq_adjust_source = explicit-time-delay
iq_adjust_amplitude = 0,0,0,0
iq_adjust_time_delay_ns = 0,0,0,0

[adpis]
en_adpis = 0
adpis_proc_size = 8192
# Initial gain 40.2 dB (index 402 = dB*10) on all channels.
# Required for correlation peak > 20 dB during calibration.
adpis_gains_init = 402,402,402,402,402

[data_interface]
out_data_iface_type = eth
