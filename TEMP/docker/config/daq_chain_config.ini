# ============================================================
#  KrakenSDR – DAQ Chain Configuration (USB 2.0 optimised)
#
#  Mount this file as a volume to override the image default:
#
#    -v ./docker/config/daq_chain_config.ini:\
#       /opt/krakensdr/heimdall_daq_fw/Firmware/daq_chain_config.ini:ro
#
#  Key differences from the stock kraken_default profile:
#    sample_rate      → 1 024 000 Hz  (was 2 400 000)
#      Reduces USB traffic from ~24 MB/s to ~10 MB/s for 5 channels.
#    cpi_size         → 131 072       (was 1 048 576)
#      Smaller CPI = shorter processing latency, faster reconfiguration.
#    daq_buffer_size  → 65 536        (was 262 144)
#      Shallower ring buffer = lower baseline latency.
#    out_data_iface_type → eth
#      TCP socket interface (not eth0 which breaks with host networking).
# ============================================================

[meta]
ini_version = 7
config_name = kraken_usb2_optimized

[hw]
name = kraken5
unit_id = 0
ioo_type = 0
num_ch = 5
en_bias_tee = 0,0,0,0,0

[daq]
# log_level: 1=DEBUG 2=INFO/WARNING 3=ERROR 4=CRITICAL 5=quiet
log_level = 2
# Aumentato da 65536: riduce il circular buffer overrun segnalato in rtl_daq.log
daq_buffer_size = 131072
center_freq = 433900000
sample_rate = 1024000
gain = 0
en_noise_source_ctr = 1
ctr_channel_serial_no = 1000

[pre_processing]
cpi_size = 131072
decimation_ratio = 1
fir_relative_bandwidth = 1.0
fir_tap_size = 1
fir_window = hann
en_filter_reset = 0

[calibration]
corr_size = 32768
std_ch_ind = 0
# en_iq_cal = 0: calibrazione solo dei ritardi campione (sample sync).
# La correzione IQ di ampiezza/fase NON serve per la visualizzazione FFT
# ed è la causa del death spiral: la soglia 20 dB veniva superata durante
# il burst recalibrazione (cal_track_mode=2), resettando STATE_INIT.
en_iq_cal = 0
amplitude_cal_mode = channel_power
en_gain_tune_init = 0
gain_lock_interval = 0
unified_gain_control = 0
require_track_lock_intervention = 0
# cal_track_mode = 0: calibrazione SOLO all'avvio (una tantum).
# Con 2 (burst periodico) il sistema entrava in un loop DUMMY infinito
# ogni volta che il picco di correlazione scendeva sotto 20 dB (USB jitter).
cal_track_mode = 0
cal_frame_interval = 86
cal_frame_burst_size = 10
amplitude_tolerance = 2
phase_tolerance = 1
# Aumentato da 10: tolera jitter USB transitorio senza resettare STATE_INIT
maximum_sync_fails = 25
iq_adjust_source = explicit-time-delay
iq_adjust_amplitude = 0,0,0,0
iq_adjust_time_delay_ns = 0,0,0,0

[adpis]
en_adpis = 0
adpis_proc_size = 8192
# Gain iniziale 40.2 dB (indice 402 dB×10) su tutti i canali.
# Essenziale per avere picco di correlazione > 20 dB durante la calibrazione.
adpis_gains_init = 402,402,402,402,402

[data_interface]
out_data_iface_type = eth
